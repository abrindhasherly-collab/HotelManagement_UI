<h2>Login</h2>

<div>
  <label>Email</label>
  <input
    type="email"
    [(ngModel)]="email"
    placeholder="Enter email">
</div>

<br>

<div>
  <label>Password</label>
  <input
    type="password"
    [(ngModel)]="password"
    placeholder="Enter password">
</div>

<br>

<button (click)="login()">Login</button>
