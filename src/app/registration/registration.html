<h2>Registration</h2>

<div>
  <label>Name</label>
  <input
    type="text"
    [(ngModel)]="name"
    placeholder="Enter name">
</div>

<br>

<div>
  <label>Email</label>
  <input
    type="email"
    [(ngModel)]="email"
    placeholder="Enter email">
</div>

<br>

<div>
  <label>Password</label>
  <input
    type="password"
    [(ngModel)]="password"
    placeholder="Enter password">
</div>

<br>

<button (click)="register()">Register</button>
